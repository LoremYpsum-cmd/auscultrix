# GitHub Pages (source: branch master, folder /docs). Sitemap and SEO tags are
# generated automatically, so every page is indexable.
title: Auscultrix
description: >-
  Ascolto, paesaggio sonoro generativo e media che confortano: un'estensione per
  browser che calcola sul dispositivo. Documentazione e misure (IT/EN).
lang: it
url: "https://loremypsum-cmd.github.io"
baseurl: "/auscultrix"
author: Rosario Orazio Caccamo
theme: jekyll-theme-primer
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-titles-from-headings
relative_links:
  enabled: true
  collections: false
titles_from_headings:
  enabled: true
  strip_title: false
