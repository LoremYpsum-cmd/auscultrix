<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Auscultrix acoustic bench</title>
<style>body{font:14px system-ui;margin:24px;background:#f4efe4;color:#1d1b17}pre{white-space:pre-wrap;font-size:12px}</style></head>
<body><h1>Acoustic bench</h1><button id="go">Run</button><pre id="out"></pre>
<script type="module">
import { runAcousticBench } from './bench.mjs';
const out = document.getElementById('out');
window.runBench = async (opts) => {
  out.textContent = 'running…\n';
  const r = await runAcousticBench({ ...opts, log: (l) => (out.textContent += l + '\n') });
  window.__bench = r;
  out.textContent += '\n' + JSON.stringify({ A1: r.A1, A2: r.A2, A3: r.A3, A4: { drone: r.A4.spearmanDrone, mix: r.A4.spearmanMix }, A5: r.A5, wall: r.renderWallSeconds }, null, 2);
  return r;
};
document.getElementById('go').onclick = () => window.runBench();
</script></body></html>
